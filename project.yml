# Projet Xcode généré par XcodeGen : `brew install xcodegen && xcodegen`.
# Le .xcodeproj n'est pas versionné.
name: Triamail
options:
  bundleIdPrefix: io.github.czj
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  TriamailKit:
    path: Packages/TriamailKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0" # x-release-please-version
    CURRENT_PROJECT_VERSION: "1"
targets:
  Triamail:
    type: application
    platform: macOS
    sources:
      - App/Sources
      - App/Resources
      # Modèles de réponse livrés avec l'app, copiés dans le dossier de réglages au premier lancement.
      - path: modeles
        type: folder
        buildPhase: resources
    dependencies:
      - package: TriamailKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.czj.triamail
        PRODUCT_NAME: Triamail
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Triamail
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSRemindersFullAccessUsageDescription: "Triamail crée des rappels pour les mails à suivre (J+1, J+3, J+7 ou une date)."
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ENABLE_HARDENED_RUNTIME: YES
        # Pas de bac à sable : l'app écrit dans les dossiers choisis et écoute sur 127.0.0.1 pour OAuth.
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  Triamail:
    build:
      targets:
        Triamail: all
    test:
      targets:
        - package: TriamailKit/TriamailKitTests
