# Xcode project generated by XcodeGen: `brew install xcodegen && xcodegen`.
# The .xcodeproj is not versioned.
name: Triamail
options:
  bundleIdPrefix: io.github.czj
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  TriamailKit:
    path: Packages/TriamailKit
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.9.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.2.0" # x-release-please-version
    CURRENT_PROJECT_VERSION: "1" # the release passes the run number: Sparkle compares this number
targets:
  Triamail:
    type: application
    platform: macOS
    sources:
      - App/Sources
      - App/Resources
      # Reply templates shipped with the app, copied into the settings folder on first launch.
      - path: modeles
        type: folder
        buildPhase: resources
    dependencies:
      - package: TriamailKit
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.czj.triamail
        PRODUCT_NAME: Triamail
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: App/Info.plist
        # Empty locally: Sparkle then stays off. The release provides it (repository variable).
        SPARKLE_PUBLIC_KEY: ""
        INFOPLIST_KEY_CFBundleDisplayName: Triamail
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSRemindersFullAccessUsageDescription: "Triamail crée des rappels pour les mails à suivre (J+1, J+3, J+7 ou une date)."
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ENABLE_HARDENED_RUNTIME: YES
        # No sandbox: the app writes to the chosen folders and listens on 127.0.0.1 for OAuth.
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  Triamail:
    build:
      targets:
        Triamail: all
    test:
      targets:
        - package: TriamailKit/TriamailKitTests
