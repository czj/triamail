name: CI

on:
  push:
    branches: [main]
  # Une PR en brouillon ne lance rien : la passer en « prête » démarre la CI.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  no-personal-data:
    name: Aucune info personnelle ni secret
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # gitleaks lit tout l'historique
      - name: Secrets (gitleaks)
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.24.3 git --redact --verbose /repo
      - name: Téléphones et adresses mail
        run: |
          # Numéros français et adresses mail, hors domaines d'exemple et adresses techniques.
          if git grep -nIE '(\+33|0033|\b0)[ .]?[1-9]([ .]?[0-9]{2}){4}' -- . ':!*.lock' \
             | grep -vE '\+33 1 23 45 67 89|01 23 45 67 89'; then
            echo "::error::Numéro de téléphone trouvé : voir AGENTS.md"; exit 1; fi
          if git grep -nIE '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[a-z]{2,}' -- . \
             | grep -vE '@(exemple\.com|example\.com|anthropic\.com|users\.noreply\.github\.com)'; then
            echo "::error::Adresse mail trouvée : voir AGENTS.md"; exit 1; fi

  build:
    name: Build macOS
    if: ${{ !github.event.pull_request.draft }}
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build et tests
        run: |
          if [ -f Package.swift ]; then
            swift build && swift test
          elif ls *.xcodeproj >/dev/null 2>&1; then
            xcodebuild -scheme Triamail -destination 'platform=macOS' \
              CODE_SIGNING_ALLOWED=NO build test
          else
            echo "Pas encore de code à compiler."
          fi

  # Le seul contrôle exigé par la règle de protection de main : on peut ajouter ou renommer
  # des jobs au-dessus sans toucher à la règle. Tout nouveau job doit figurer dans needs.
  passed:
    name: CI passed
    if: ${{ always() && !github.event.pull_request.draft }}
    needs: [no-personal-data, build]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Tous les jobs ont réussi
        run: echo "$NEEDS" | jq --exit-status 'all(.[]; .result == "success")'
        env:
          NEEDS: ${{ toJSON(needs) }}
