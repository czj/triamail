name: CI

on:
  push:
    branches: [main]
  # A draft PR runs nothing: marking it ready for review starts CI.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  no-personal-data:
    name: No personal data or secrets
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # gitleaks reads the whole history
      - name: Secrets (gitleaks)
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.24.3 git --redact --verbose /repo
      - name: Phone numbers and email addresses
        run: |
          # French phone numbers and email addresses, except example domains and public technical addresses (GitHub…).
          if git grep -nIE '(\+33|0033|\b0)[ .]?[1-9]([ .]?[0-9]{2}){4}' -- . ':!*.lock' \
             | grep -vE '\+33 1 23 45 67 89|01 23 45 67 89'; then
            echo "::error::Phone number found: see AGENTS.md"; exit 1; fi
          if git grep -nIE '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[a-z]{2,}' -- . \
             | grep -viE '@([a-z0-9-]+\.)*(exemple|example)\.(com|org|fr)|@anthropic\.com|notifications@github\.com|@([a-z0-9-]+\.)*noreply\.github\.com|@[23]x\.(png|jpe?g|pdf)'; then
            echo "::error::Email address found: see AGENTS.md"; exit 1; fi

  build:
    name: Build macOS
    if: ${{ !github.event.pull_request.draft }}
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Versions
        run: xcodebuild -version && swift --version
      - name: TriamailKit tests
        run: swift test --package-path Packages/TriamailKit
      - name: Generate the Xcode project
        run: brew install xcodegen && xcodegen generate
      - name: Build the app
        run: |
          if ! xcodebuild -project Triamail.xcodeproj -scheme Triamail -configuration Debug \
               -destination 'platform=macOS' -derivedDataPath DerivedData build > build.log 2>&1; then
            # Compiler errors as annotations on the diff, then the end of the log.
            grep -E "^/.+:[0-9]+:[0-9]+: error: " build.log | sort -u | while IFS= read -r line; do
              file=${line%%:*}; rest=${line#*:}; row=${rest%%:*}; rest=${rest#*:}; col=${rest%%:*}; msg=${rest#*: error: }
              echo "::error file=${file#$GITHUB_WORKSPACE/},line=$row,col=$col::$msg"
            done
            tail -25 build.log
            exit 1
          fi
          grep -cE ": warning: " build.log | xargs echo "Warnings:"
      # The Debug app (ad hoc signed, Apple silicon), to try a branch on a Mac without Xcode:
      # unzip, `xattr -dr com.apple.quarantine Triamail.app`, then `open -n Triamail.app --args -demo`.
      # Main has the signed release builds instead.
      - name: Zip the app
        if: ${{ github.event_name != 'push' && !startsWith(github.ref_name, 'release-please--') }}
        run: ditto -c -k --keepParent DerivedData/Build/Products/Debug/Triamail.app Triamail-debug.zip
      - name: Upload the app
        if: ${{ github.event_name != 'push' && !startsWith(github.ref_name, 'release-please--') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: Triamail-debug.zip
          # Already a zip (ditto keeps Sparkle's framework symlinks): no zip inside a zip.
          # Unarchived, the artifact takes the file's name: `gh run download <run> -n Triamail-debug.zip`.
          archive: false
          overwrite: true
          retention-days: 7

  # The only check required by main's branch protection rule: jobs above can be added or renamed
  # without touching the rule. Every new job must be listed in needs.
  passed:
    name: CI passed
    if: ${{ always() && !github.event.pull_request.draft }}
    needs: [no-personal-data, build]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: All jobs succeeded
        run: echo "$NEEDS" | jq --exit-status 'all(.[]; .result == "success")'
        env:
          NEEDS: ${{ toJSON(needs) }}

  # Releases go out by themselves: once the release PR (release-please) is green, merge it and publish.
  # A merge with GITHUB_TOKEN starts no workflow, so the Release workflow is started explicitly on main
  # (workflow_dispatch is the one event GITHUB_TOKEN may trigger); there it creates the tag and the release.
  release:
    name: Merge the release PR and publish
    needs: passed
    if: ${{ github.event_name == 'workflow_dispatch' && startsWith(github.ref_name, 'release-please--') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Merge and start the release
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          HEAD: ${{ github.sha }}
        run: |
          pr=$(gh pr view "$BRANCH" --repo "$GITHUB_REPOSITORY" --json number,state,author,labels,body)
          # Only release-please's own open PR, labelled "autorelease: pending".
          if ! echo "$pr" | jq -e '.state == "OPEN" and .author.login == "app/github-actions"
               and any(.labels[]; .name == "autorelease: pending")' > /dev/null; then
            echo "Not an open release-please PR: nothing to do."; exit 0
          fi
          # Only versions with something for users (features, fixes): docs or chores wait for the next one.
          if ! echo "$pr" | jq -e '.body | test("### (Features|Bug Fixes)")' > /dev/null; then
            echo "::notice::No feature nor fix in this release: it waits (merge it by hand to publish anyway)."; exit 0
          fi
          # Only the commit this run checked: a newer push to the release branch gets its own CI run.
          # A few tries: the "CI passed" check this run just reported can take a moment to count.
          for try in 1 2 3 4 5; do
            gh pr merge "$BRANCH" --repo "$GITHUB_REPOSITORY" --squash --match-head-commit "$HEAD" && break
            [ "$try" = 5 ] && exit 1
            sleep 15
          done
          for try in 1 2 3; do
            gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main && exit 0
            sleep 15
          done
          echo "::error::Release PR merged but the Release workflow did not start: run it on main by hand (Actions > Release)."
          exit 1
