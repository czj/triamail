name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

# Une publication à la fois, jamais interrompue en cours.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-app:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Construire l'app
        run: |
          if ! ls *.xcodeproj >/dev/null 2>&1; then
            echo "Pas encore de projet Xcode : rien à joindre."; exit 0; fi
          xcodebuild -scheme Triamail -configuration Release \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          APP=$(find build -name 'Triamail.app' -maxdepth 6 | head -1)
          ditto -c -k --keepParent "$APP" Triamail.zip
          gh release upload "${{ needs.release-please.outputs.tag }}" Triamail.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}
