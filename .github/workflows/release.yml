name: Release

on:
  push:
    branches: [main]
  # Lancement à la main (sur n'importe quelle branche) : construit l'app et la joint au run, sans rien publier.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Une publication à la fois, jamais interrompue en cours.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-app:
    needs: release-please
    if: ${{ always() && (needs.release-please.outputs.created == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: macos-26
    timeout-minutes: 45
    env:
      TAG: ${{ needs.release-please.outputs.tag }}
      # Un secret ne peut pas servir dans un `if` : on n'expose que leur présence.
      HAS_SPARKLE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY != '' }}
      HAS_DEVELOPER_ID: ${{ secrets.DEVELOPER_ID_CERTIFICATE != '' }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Version
        run: |
          if [ -n "$TAG" ]; then VERSION=${TAG#v}; else
            VERSION=$(sed -nE 's/.*MARKETING_VERSION: "([^"]+)".*/\1/p' project.yml); fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      # Facultatif : avec un certificat « Developer ID Application » (abonnement Apple Developer),
      # l'app est signée et notarisée et s'ouvre sans avertissement. Sinon : signature ad hoc.
      - name: Certificat Developer ID
        if: ${{ env.HAS_DEVELOPER_ID == 'true' }}
        env:
          CERTIFICATE: ${{ secrets.DEVELOPER_ID_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -nE 's/.*"(Developer ID Application: [^"]+)".*/\1/p' | head -1)
          [ -n "$IDENTITY" ] || { echo "::error::Aucune identité Developer ID Application dans le certificat"; exit 1; }
          echo "DEVELOPER_ID=$IDENTITY" >> "$GITHUB_ENV"
      - name: Construire et empaqueter
        env:
          SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # Le numéro du run sert de numéro de build : Sparkle le compare d'une version à l'autre.
        run: scripts/package.sh "$VERSION" "$GITHUB_RUN_NUMBER"
      # Le flux Sparkle, signé avec la clé privée (secret du dépôt). Sans secret : pas de flux, l'app reste sans mises à jour.
      - name: Flux de mises à jour (Sparkle)
        if: ${{ env.HAS_SPARKLE_KEY == 'true' && env.TAG != '' }}
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          SPARKLE_VERSION: 2.9.6
        run: |
          curl -sSfL --retry 4 -o sparkle.tar.xz \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          mkdir sparkle && tar -xf sparkle.tar.xz -C sparkle
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/ed25519"
          sparkle/bin/generate_appcast --ed-key-file "$RUNNER_TEMP/ed25519" \
            --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/" dist
          rm "$RUNNER_TEMP/ed25519"
      - name: Joindre au run (lancement à la main)
        if: ${{ env.TAG == '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Triamail-${{ env.VERSION }}
          path: Triamail.dmg
          retention-days: 7
      - name: Joindre à la release
        if: ${{ env.TAG != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" Triamail.dmg Triamail.zip dist/*.zip --clobber
          if [ -f dist/appcast.xml ]; then gh release upload "$TAG" dist/appcast.xml --clobber; fi
          # La façon d'installer, sous le changelog écrit par release-please.
          {
            gh release view "$TAG" --json body --jq .body
            printf '\n## Installer\n\n'
            printf -- '- **Homebrew** : `brew tap czj/triamail https://github.com/czj/triamail && brew install --cask triamail`\n'
            printf -- '- **À la main** : ouvrir `Triamail.dmg` et glisser Triamail dans Applications.\n'
          } > notes.md
          gh release edit "$TAG" --notes-file notes.md
