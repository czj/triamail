name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

# Une publication à la fois, jamais interrompue en cours.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-app:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    env:
      # Un secret ne peut pas servir dans un `if` : on n'expose que sa présence.
      HAS_SPARKLE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY != '' }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Construire l'app
        shell: bash
        env:
          SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          brew install xcodegen && xcodegen generate
          xcodebuild -project Triamail.xcodeproj -scheme Triamail -configuration Release \
            -destination 'platform=macOS' -derivedDataPath build \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            SPARKLE_PUBLIC_KEY="$SPARKLE_PUBLIC_KEY" build
          mkdir -p dist
          APP=$(find build/Build/Products/Release -maxdepth 1 -name 'Triamail.app' | head -1)
          # Signature ad hoc (sans abonnement Apple) : macOS propose « Ouvrir » au lieu de dire l'app endommagée.
          codesign --verify --deep "$APP"
          ditto -c -k --keepParent "$APP" "dist/Triamail-${TAG#v}.zip"
          cp "dist/Triamail-${TAG#v}.zip" Triamail.zip
      # Le flux Sparkle, signé avec la clé privée (secret du dépôt). Sans secret : pas de flux, l'app reste sans mises à jour.
      - name: Flux de mises à jour (Sparkle)
        if: ${{ env.HAS_SPARKLE_KEY == 'true' }}
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          TAG: ${{ needs.release-please.outputs.tag }}
          SPARKLE_VERSION: 2.9.6
        run: |
          curl -sSfL --retry 4 -o sparkle.tar.xz \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          mkdir sparkle && tar -xf sparkle.tar.xz -C sparkle
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/ed25519"
          sparkle/bin/generate_appcast --ed-key-file "$RUNNER_TEMP/ed25519" \
            --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/" dist
          rm "$RUNNER_TEMP/ed25519"
      - name: Joindre à la release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          gh release upload "$TAG" Triamail.zip dist/*.zip --clobber
          if [ -f dist/appcast.xml ]; then gh release upload "$TAG" dist/appcast.xml --clobber; fi
