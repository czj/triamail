name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

# Une publication à la fois, jamais interrompue en cours.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-app:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Construire l'app
        run: |
          brew install xcodegen && xcodegen generate
          xcodebuild -project Triamail.xcodeproj -scheme Triamail -configuration Release \
            -destination 'platform=macOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          APP=$(find build/Build/Products/Release -maxdepth 1 -name 'Triamail.app' | head -1)
          ditto -c -k --keepParent "$APP" Triamail.zip
          gh release upload "${{ needs.release-please.outputs.tag }}" Triamail.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}
