# Actions are pinned by commit, not by tag (a tag can be moved): Dependabot proposes
# each new version, a week after its release, in a single PR.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
